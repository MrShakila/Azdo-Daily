[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azdo-daily"
version = "1.1.0"
description = "Azure DevOps daily task automation with AI task breakdown"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Shakila", email = "shadikari012@gmail.com"}]
license = "MIT"
keywords = ["azure-devops", "task-automation", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
dev = ["black>=23.0.0", "flake8>=6.0.0", "pytest>=7.0.0"]

[project.urls]
Repository = "https://github.com/MrShakila/Azdo-Daily"
Issues = "https://github.com/MrShakila/Azdo-Daily/issues"

[project.scripts]
azdo-daily = "azdo_daily.main:main"

[tool.setuptools]
packages = ["azdo_daily"]

[tool.black]
line-length = 88
target-version = ["py39"]
